name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch cancels its older run. Every commit that reaches main is tested to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The newest Rust release at least 30 days old.
  RUST_TOOLCHAIN: 1.99.0
  # The rust-version in Cargo.toml, for the msrv job.
  RUST_MSRV: 1.89.0

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      # Only main saves the cache, so a pull request can't change what main restores.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The crates still build with the rust-version they declare.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_MSRV }}
        run: |
          rustup toolchain install "$RUST_MSRV" --profile minimal
          cargo "+$RUST_MSRV" check --workspace --locked

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built from crates.io with its own lock file. The advisories come from the RustSec database.
      - name: cargo-deny
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo "+$RUST_TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          cargo deny --all-features check advisories sources
