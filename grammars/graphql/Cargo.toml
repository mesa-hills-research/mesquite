[package]
name = "mesquite_graphql"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The GraphQL grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-graphql 0.1.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "graphql"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_graphql"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
