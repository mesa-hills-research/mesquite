[package]
name = "mesquite_svelte"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Svelte grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-svelte-ng 1.0.2"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "svelte"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_svelte_ng"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
