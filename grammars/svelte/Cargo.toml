[package]
name = "mesquite_svelte"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Svelte grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-svelte-ng 1.0.2"

[lib]
name = "tree_sitter_svelte_ng"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
