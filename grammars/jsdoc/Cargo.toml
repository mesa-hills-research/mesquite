[package]
name = "mesquite_jsdoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The JSDoc grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-jsdoc 0.23.2"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "jsdoc"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_jsdoc"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
