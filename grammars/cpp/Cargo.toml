[package]
name = "mesquite_cpp"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The C++ grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-cpp 0.23.4"

[lib]
name = "tree_sitter_cpp"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
