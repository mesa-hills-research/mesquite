[package]
name = "mesquite_swift"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Swift grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-swift 0.7.4"

[lib]
name = "tree_sitter_swift"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
