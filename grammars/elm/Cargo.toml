[package]
name = "mesquite_elm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Elm grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-elm 5.9.4"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "elm"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_elm"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
