[package]
name = "mesquite_astro"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Astro grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-astro-next 0.1.1"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "astro"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_astro_next"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
