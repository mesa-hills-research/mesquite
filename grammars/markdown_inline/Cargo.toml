[package]
name = "mesquite_markdown_inline"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Markdown (inline) grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-md 0.5.3"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "markdown"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_markdown_inline"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
