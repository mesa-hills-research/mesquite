[package]
name = "mesquite_php"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The PHP grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-php 0.25.1"

[lib]
name = "tree_sitter_php"

[dependencies]
mesquite_language = { path = "../../tables" }
mesquite_php_only = { path = "../php_only" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
