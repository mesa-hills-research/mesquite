[package]
name = "mesquite_lua"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Lua grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-lua 0.5.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "lua"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_lua"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
