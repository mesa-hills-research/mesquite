[package]
name = "mesquite_cuda"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The CUDA grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-cuda 0.21.2"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "cuda"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_cuda"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
