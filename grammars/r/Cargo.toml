[package]
name = "mesquite_r"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The R grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-r 1.3.0"

[lib]
name = "tree_sitter_r"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
