[package]
name = "mesquite_xml"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The XML grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-xml 0.7.0"

[lib]
name = "tree_sitter_xml"

[dependencies]
mesquite_language = { path = "../../tables" }
mesquite_dtd = { path = "../dtd" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
