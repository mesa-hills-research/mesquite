[package]
name = "mesquite_bash"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Bash grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-bash 0.25.1"

[lib]
name = "tree_sitter_bash"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
