[package]
name = "mesquite_solidity"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Solidity grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-solidity 1.2.13"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "solidity"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_solidity"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
