[package]
name = "mesquite_php_only"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The PHP (without HTML) grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-php 0.25.1"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "php"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_php_only"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
