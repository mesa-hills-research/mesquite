[package]
name = "mhr_tree_sitter_php_only"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The PHP (without HTML) grammar for mhr_tree_sitter (pure-Rust tree-sitter), from tree-sitter-php 0.25.1"

[lib]
name = "tree_sitter_php_only"

[dependencies]
mhr_tree_sitter_language = { path = "../../tables" }

[dev-dependencies]
mhr_tree_sitter = { path = "../../runtime" }
