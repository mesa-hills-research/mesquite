[package]
name = "mesquite_dart"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Dart grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-dart 0.2.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "dart"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_dart"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
