[package]
name = "mesquite_ocaml"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The OCaml grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-ocaml 0.26.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "ocaml"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_ocaml"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }
mesquite_ocaml_interface = { version = "0.1.0", path = "../ocaml_interface" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
