[package]
name = "mesquite_glsl"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The GLSL grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-glsl 0.2.0"

[lib]
name = "tree_sitter_glsl"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
