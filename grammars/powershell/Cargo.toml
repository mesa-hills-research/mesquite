[package]
name = "mesquite_powershell"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The PowerShell grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-powershell 0.26.3"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "powershell"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_powershell"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
