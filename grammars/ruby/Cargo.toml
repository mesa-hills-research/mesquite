[package]
name = "mesquite_ruby"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Ruby grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-ruby 0.23.1"

[lib]
name = "tree_sitter_ruby"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
