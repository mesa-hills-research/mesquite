[package]
name = "mesquite_proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Protocol Buffers grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-proto 0.6.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "protobuf"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_proto"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
