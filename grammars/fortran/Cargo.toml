[package]
name = "mesquite_fortran"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Fortran grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-fortran 0.6.0"

[lib]
name = "tree_sitter_fortran"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
