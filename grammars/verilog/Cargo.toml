[package]
name = "mesquite_verilog"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Verilog grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-verilog 1.0.3"

[lib]
name = "tree_sitter_verilog"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
