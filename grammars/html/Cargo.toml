[package]
name = "mesquite_html"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The HTML grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-html 0.23.2"

[lib]
name = "tree_sitter_html"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
