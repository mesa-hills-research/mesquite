[package]
name = "mesquite_make"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Make grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-make 1.1.1"

[lib]
name = "tree_sitter_make"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
