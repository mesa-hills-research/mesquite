[package]
name = "mesquite_make"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Make grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-make 1.1.1"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "makefile"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_make"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
