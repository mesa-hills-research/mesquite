[package]
name = "mesquite_json"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The JSON grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-json 0.24.8"

[lib]
name = "tree_sitter_json"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
