[package]
name = "mesquite_c"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The C grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-c 0.24.2"

[lib]
name = "tree_sitter_c"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
