[package]
name = "mesquite_yaml"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The YAML grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-yaml 0.7.2"

[lib]
