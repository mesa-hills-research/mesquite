[package]
name = "mesquite_fsharp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The F# grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-fsharp 0.3.12"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "fsharp"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_fsharp"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
