[package]
name = "mesquite_python"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Python grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-python 0.25.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "python"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_python"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
