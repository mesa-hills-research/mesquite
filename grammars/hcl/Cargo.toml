[package]
name = "mesquite_hcl"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The HCL grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-hcl 1.1.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "hcl"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_hcl"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
