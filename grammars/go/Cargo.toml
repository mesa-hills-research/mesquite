[package]
name = "mesquite_go"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Go grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-go 0.25.0"

[lib]
name = "tree_sitter_go"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
