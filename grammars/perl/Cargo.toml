[package]
name = "mesquite_perl"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Perl grammar for Mesquite (pure-Rust tree-sitter), from ts-parser-perl 2.0.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "perl"]
categories = ["parsing", "text-editors"]

[lib]
name = "ts_parser_perl"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
