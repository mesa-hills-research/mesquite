[package]
name = "mesquite_dtd"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The DTD grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-xml 0.7.0"

[lib]
name = "tree_sitter_dtd"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
