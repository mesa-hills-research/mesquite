[package]
name = "mesquite_kotlin"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Kotlin grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-kotlin-ng 1.1.0"

[lib]
name = "tree_sitter_kotlin_ng"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
