[package]
name = "mesquite_c_sharp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The C# grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-c-sharp 0.23.5"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "csharp"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_c_sharp"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
