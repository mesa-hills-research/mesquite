[package]
name = "mesquite_embedded_template"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Embedded templates (ERB, EJS) grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-embedded-template 0.25.0"

[lib]
name = "tree_sitter_embedded_template"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
