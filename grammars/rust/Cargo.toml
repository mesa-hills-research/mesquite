[package]
name = "mesquite_rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Rust grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-rust 0.24.2"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "rust"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_rust"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
