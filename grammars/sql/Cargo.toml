[package]
name = "mesquite_sql"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The SQL grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-sequel 0.3.11"

[lib]
name = "tree_sitter_sequel"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
