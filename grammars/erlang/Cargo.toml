[package]
name = "mesquite_erlang"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Erlang grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-erlang 0.20.0"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "erlang"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_erlang"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
