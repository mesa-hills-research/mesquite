[package]
name = "mesquite_ocaml_interface"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The OCaml (interface) grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-ocaml 0.26.0"

[lib]
name = "tree_sitter_ocaml_interface"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
