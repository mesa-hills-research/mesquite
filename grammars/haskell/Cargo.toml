[package]
name = "mesquite_haskell"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Haskell grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-haskell 0.24.1"

[lib]
name = "tree_sitter_haskell"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
