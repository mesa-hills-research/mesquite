[package]
name = "mesquite_julia"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Julia grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-julia 0.23.1"

[lib]
name = "tree_sitter_julia"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
