[package]
name = "mesquite_elixir"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Elixir grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-elixir 0.3.5"

[lib]
name = "tree_sitter_elixir"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
