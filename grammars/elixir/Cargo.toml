[package]
name = "mesquite_elixir"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Elixir grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-elixir 0.3.5"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "elixir"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_elixir"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
