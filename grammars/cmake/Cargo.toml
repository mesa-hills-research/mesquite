[package]
name = "mesquite_cmake"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The CMake grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-cmake 0.7.5"

[lib]
name = "tree_sitter_cmake"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
