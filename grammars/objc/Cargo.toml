[package]
name = "mesquite_objc"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
publish = false
description = "The Objective-C grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-objc 3.0.2"

[lib]
name = "tree_sitter_objc"

[dependencies]
mesquite_language = { path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
