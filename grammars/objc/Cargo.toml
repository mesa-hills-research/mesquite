[package]
name = "mesquite_objc"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mesa-hills-research/mesquite"
description = "The Objective-C grammar for Mesquite (pure-Rust tree-sitter), from tree-sitter-objc 3.0.2"
readme = "../../README.md"
keywords = ["tree-sitter", "parser", "grammar", "objective-c"]
categories = ["parsing", "text-editors"]

[lib]
name = "tree_sitter_objc"

[dependencies]
mesquite_language = { version = "0.1.0", path = "../../tables" }

[dev-dependencies]
mesquite = { path = "../../runtime" }
